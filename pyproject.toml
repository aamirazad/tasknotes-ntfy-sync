[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "tasknotes-ntfy"
version = "0.1.0"
description = "Durable TaskNotes reminder delivery through ntfy"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.28.1,<0.29",
  "isodate>=0.7.2,<0.8",
  "pydantic-settings>=2.10.1,<3",
  "PyYAML>=6.0.2,<7",
  "watchfiles>=1.1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "respx>=0.22,<0.23",
  "ruff>=0.12,<0.13",
]

[project.scripts]
tasknotes-ntfy = "tasknotes_ntfy.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tasknotes_ntfy"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["tasknotes_ntfy"]

